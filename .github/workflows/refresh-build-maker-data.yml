name: Refresh Build Maker Data

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"   # Pazartesi 06:23 UTC — haftalik veri tazeleme

permissions:
  contents: write

concurrency:
  group: refresh-build-maker-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh build maker data
        run: |
          python3 scripts/build-maker-data.py
          python3 scripts/build-maker-changelog.py

      - name: Commit changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add assets/data/build-maker.json assets/data/build-maker-prev.json assets/data/build-maker-changelog.json
          if git diff --cached --quiet; then
            echo "No build maker data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          suffix="$(date -u +%s%N | sha256sum | cut -c1-8)"
          git commit -m "build maker data refresh $suffix"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            if [ "$attempt" = 3 ]; then
              echo "Push was rejected after ${attempt} attempts."
              exit 1
            fi
            echo "Push raced with another main update; rebasing before retry ${attempt}."
            git fetch origin main
            git rebase origin/main
          done