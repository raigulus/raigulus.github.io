name: Discover YouTube Uploads

on:
  workflow_dispatch:
  schedule:
    - cron: "20 * * * *"

permissions:
  contents: write

concurrency:
  group: discover-youtube
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Discover and add new uploads
        run: python3 scripts/discover_youtube.py

      - name: Commit changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add assets/data/videos.json division-2/videos/ division-2/index.html index.html sitemap.txt sitemap.xml feed.xml
          if git diff --cached --quiet; then
            echo "No new videos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "content: auto-add youtube uploads"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            if [ "$attempt" = 3 ]; then
              echo "Push was rejected after ${attempt} attempts."
              exit 1
            fi
            git fetch origin main
            git stash
            git rebase origin/main
            git stash pop || true
          done
