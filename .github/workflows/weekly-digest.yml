name: Weekly Digest

on:
  workflow_dispatch:
  schedule:
    - cron: "5 9 * * 2"

permissions:
  contents: write
  pages: write

concurrency:
  group: weekly-digest
  cancel-in-progress: true

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate weekly digest
        run: python3 scripts/generate-weekly-digest.py

      - name: Commit changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add division-2/this-week sitemap.txt sitemap.xml
          if git diff --cached --quiet; then
            echo "No digest changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          suffix="$(date -u +%s%N | sha256sum | cut -c1-8)"
          git commit -m "site update $suffix"
          for attempt in 1 2 3; do
            if git push; then
              gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds"
              exit 0
            fi
            if [ "$attempt" = 3 ]; then
              echo "Push was rejected after ${attempt} attempts."
              exit 1
            fi
            echo "Push raced with another main update; rebasing before retry ${attempt}."
            git fetch origin main
            git rebase origin/main
          done
