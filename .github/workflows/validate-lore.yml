name: Validate Lore Archive

on:
  pull_request:
    paths:
      - "content/lore/**"
      - "schemas/**"
      - "scripts/build_lore.py"
      - "scripts/validate_lore.py"
      - "scripts/test_validate_lore.py"
      - "assets/lore.css"
      - "assets/lore-timeline.css"
      - "assets/lore-directory.css"
      - "assets/data/videos.json"
      - "lore/**"
      - "division-2/**"
      - "index.html"
      - "llms.txt"
      - "scripts/sync_site_metadata.py"
      - "sitemap.xml"
      - "sitemap.txt"
  workflow_dispatch:
  schedule:
    # The lore gate only ever ran on pull requests, and this repo takes commits
    # directly, so the last run was 87 days old. Daily is enough to catch a
    # broken record or a page the generator no longer reproduces.
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate lore records
        run: python3 scripts/validate_lore.py --strict-site-inventory

      - name: Run lore guardrail tests
        run: python3 -m unittest scripts/test_validate_lore.py

      - name: Rebuild lore pages
        run: python3 scripts/build_lore.py

      - name: Check generated pages
        run: python3 scripts/check_lore_pages.py

      - name: Check generated site metadata
        run: python3 scripts/sync_site_metadata.py --check

      - name: Confirm generated pages are current
        run: git diff --exit-code -- lore sitemap.xml sitemap.txt
