name: IndexNow

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      all:
        description: Submit every URL in the sitemap
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Submit changed URLs
        run: |
          if [ "${{ inputs.all }}" = "true" ]; then
            python scripts/indexnow_submit.py --all
          else
            python scripts/indexnow_submit.py --days 3
          fi
