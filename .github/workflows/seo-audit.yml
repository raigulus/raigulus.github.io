# SEO Audit & Report Workflow
# Runs weekly site audit, keyword tracking, and generates reports

name: SEO Audit & Reports

on:
  schedule:
    # Runs every Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to run'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - audit-only
          - keywords-only
          - competitors-only
          - backlinks-only

env:
  PYTHON_VERSION: '3.10'
  PYTHONIOENCODING: 'utf-8'

# Never run two SEO audits at the same time. An active data-generation run must
# finish (and commit) rather than be cancelled mid-write.
concurrency:
  group: seo-audit
  cancel-in-progress: false

jobs:
  seo-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
      
      - name: Run Site Audit
        if: ${{ github.event.inputs.action == 'full' || github.event.inputs.action == 'audit-only' || github.event_name == 'schedule' }}
        env:
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
        run: |
          echo "Running site audit..."
          python scripts/seo/site_audit.py --full --output seo-reports/audit-latest.md
        continue-on-error: true
      
      - name: Track Keywords
        if: ${{ github.event.inputs.action == 'full' || github.event.inputs.action == 'keywords-only' || github.event_name == 'schedule' }}
        env:
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
        run: |
          echo "Tracking keywords..."
          python scripts/seo/keyword_tracker.py track --days 7
          python scripts/seo/keyword_tracker.py report
        continue-on-error: true
      
      - name: Run Competitor Analysis
        if: ${{ github.event.inputs.action == 'full' || github.event.inputs.action == 'competitors-only' || github.event_name == 'schedule' }}
        run: |
          echo "Running competitor analysis..."
          python scripts/seo/competitor_analysis.py compare
          python scripts/seo/competitor_analysis.py report
        continue-on-error: true
      
      - name: Verify Backlinks
        if: ${{ github.event.inputs.action == 'full' || github.event.inputs.action == 'backlinks-only' || github.event_name == 'schedule' }}
        run: |
          echo "Verifying backlinks..."
          python scripts/seo/backlink_monitor.py verify
          python scripts/seo/backlink_monitor.py report
        continue-on-error: true
      
      - name: Generate GSC Analytics Report
        if: ${{ github.event.inputs.action == 'full' || github.event_name == 'schedule' }}
        env:
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
        run: |
          echo "Generating GSC report..."
          python scripts/seo/gsc_tool.py analytics --days 7
          python scripts/seo/gsc_tool.py report
        continue-on-error: true
      
      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: seo-reports-${{ github.run_number }}
          path: seo-reports/*.md
          retention-days: 30
      
      - name: Commit tracked data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Reports stay in the run artifact (see Upload Reports). Stage only the
          # JSON files actually written by the SEO scripts in scripts/seo/.
          # backlinks*.json first appear after a successful backlink_monitor run,
          # so skip paths that do not exist yet; any other git failure fails the step.
          for f in \
            assets/data/tracked-keywords.json \
            assets/data/rankings-history.json \
            assets/data/competitors.json \
            assets/data/competitor-history.json \
            assets/data/gsc-analytics.json \
            assets/data/backlinks.json \
            assets/data/backlink-history.json; do
            if [ -f "$f" ]; then
              git add -- "$f"
            else
              echo "SEO output not present yet, skipping: $f"
            fi
          done
          # git diff --quiet exits 0 for no staged changes, 1 for staged changes,
          # and >1 for a Git error. Capture the status so an error is never
          # mistaken for the normal "changes present" case.
          set +e
          git diff --staged --quiet
          diff_status=$?
          set -e
          if [ "$diff_status" -eq 0 ]; then
            echo "No SEO data changes."
            exit 0
          elif [ "$diff_status" -ne 1 ]; then
            echo "::error::git diff --staged --quiet failed with exit code $diff_status"
            exit "$diff_status"
          fi
          git commit -m "chore: update SEO data [skip ci]"
          git push
