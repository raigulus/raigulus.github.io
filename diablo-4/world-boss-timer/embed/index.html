<body class="embed-page">
  <main class="embed-wrap">
    <div class="embed-head">
      <h1>Diablo 4 World Boss Timer</h1>
      <a href="https://raigulus.github.io/diablo-4/world-boss-timer/" target="_blank" rel="noopener">Full timer &rarr;</a>
    </div>
    <article class="video-card" data-c="special" data-timer="world-boss"
             data-anchor="2026-10-30T00:00:00Z"
             data-cycle="210" data-duration="15" data-warn-before="30"
             data-active-label="SPAWNED" data-warn-label="Kill within"
             data-idle-label="Spawns in"
             data-info-idle="Spawns every 3.5 hours, lasts 15 minutes">
      <div class="card-body">
        <p class="eyebrow">World Boss</p>
        <h2 data-timer-field="status">Next spawn</h2>
        <div data-timer-field="countdown" style="font-family: 'Barlow Condensed','Barlow Condensed Fallback',Inter,'Inter Fallback',system-ui,sans-serif; font-size: 2rem; font-weight: 700; color: #b81d40; margin: 12px 0;">Live countdown</div>
        <p data-timer-field="info">Spawns every 3.5 hours, lasts 15 minutes</p>
        <p class="meta"><span data-timer-field="next">Next: loading</span></p>
      </div>
    </article>
    <table class="facts wb-spawns-table embed-spawns">
      <thead>
        <tr><th scope="col">Day</th><th scope="col">Spawn (UTC)</th><th scope="col">Your time</th><th scope="col">Countdown</th></tr>
      </thead>
      <tbody data-wb-spawns>
        <tr><td colspan="4">The live spawn table needs JavaScript.</td></tr>
      </tbody>
    </table>
    <p class="embed-credit">Powered by <a href="https://raigulus.github.io/diablo-4/world-boss-timer/" target="_blank" rel="noopener">Raigulus</a></p>
  </main>
